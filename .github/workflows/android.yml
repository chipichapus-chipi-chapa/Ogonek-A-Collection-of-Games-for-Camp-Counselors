# APK для Android: собирается из той же Angular-версии и выкладывается в выпуск «android».
# Ссылка на скачивание всегда одна: releases/download/android/ogonek.apk
name: Android

on:
  push:
    branches: [main]
    paths: ['ogonek/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ogonek/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Сборка приложения
        working-directory: ogonek
        run: |
          npm ci
          npx ng build
          npx cap sync android
      - name: Ключ подписи
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Сборка APK
        working-directory: ogonek/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ogonek.apk"
      - name: Проверка подписи
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs ogonek.apk | head -3
      - name: Выпуск «android»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Огонёк для Android, версия 1.0.${{ github.run_number }}. Скачай ogonek.apk и установи поверх старой версии — свои игры сохранятся."
          gh release view android >/dev/null 2>&1 || gh release create android --title "Огонёк для Android" --notes "$NOTES" --latest
          gh release upload android ogonek.apk --clobber
          gh release edit android --notes "$NOTES" --latest
